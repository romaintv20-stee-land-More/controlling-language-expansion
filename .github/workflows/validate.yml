name: Validate project

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Validate repository
        run: python scripts/validate.py

      - name: Audit Controlling upstream
        run: python scripts/audit_upstream.py

      - name: Audit legacy pack
        run: python scripts/audit_legacy_pack.py

      - name: Generate legacy pack
        run: python scripts/generate_legacy_pack.py

      - name: Audit modern official locales
        run: python scripts/audit_modern_locales.py

      - name: Generate all modern builds
        run: python scripts/generate_modern_pack.py

      - name: Generate grouped modern builds
        run: python scripts/generate_grouped_modern.py

      - name: Upload audits and generated builds
        uses: actions/upload-artifact@v4
        with:
          name: controlling-audits-and-builds
          path: |
            data/generated/upstream_audit.json
            data/generated/legacy_pack_audit.json
            data/generated/modern_locale_audit.json
            data/generated/modern_pack_audit.json
            build/legacy/
            build/modern/
            build/grouped-modern/
