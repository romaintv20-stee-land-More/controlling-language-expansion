name: Validate project

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate repository
        run: python scripts/validate.py

      - name: Reconstruct pinned Marathi 1.0.1 candidates
        run: python scripts/build_marathi_1_0_1.py

      - name: Validate Marathi 26.3 pack and original 1.0.1 metadata
        run: python scripts/validate_marathi_1_0_1.py

      - name: Audit Controlling upstream
        run: python scripts/audit_upstream.py

      - name: Verify current 26.3 upstream localization compatibility
        run: python scripts/verify_current_release.py

      - name: Audit legacy pack
        run: python scripts/audit_legacy_pack.py

      - name: Generate legacy pack
        run: python scripts/generate_legacy_pack.py

      - name: Audit modern official locales
        run: python scripts/audit_modern_locales.py

      - name: Upload audits and legacy payloads
        uses: actions/upload-artifact@v4
        with:
          name: controlling-audits-and-legacy-pack
          path: |
            data/generated/upstream_audit.json
            data/generated/legacy_pack_audit.json
            data/generated/modern_locale_audit.json
            build/legacy/
